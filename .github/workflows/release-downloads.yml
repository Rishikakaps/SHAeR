name: SHAeR Release Downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run tauri:build:windows
      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $exe.FullName release-assets/SHAeR-Desktop-Companion-Windows-Setup.exe
          Copy-Item $msi.FullName release-assets/SHAeR-Desktop-Companion-Windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: apps/desktop/release-assets/*

  macos:
    name: macOS desktop installer
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run tauri -- build --bundles dmg,app
      - name: Prepare macOS release assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/SHAeR-Desktop-Companion-macOS.dmg
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/*.app release-assets/SHAeR-Desktop-Companion-macOS.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: apps/desktop/release-assets/*

  android:
    name: Android companion APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi_runtime/outputs/shaer_companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi_runtime/outputs/shaer_companion/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: chmod +x android/gradlew
      - run: npm run android:apk
      - name: Prepare Android release asset
        run: |
          mkdir -p release-assets
          cp releases/SHAeR-Companion-0.19.0-debug.apk release-assets/SHAeR-Companion-Android.apk
          cp releases/SHAeR-Companion-0.19.0-debug.apk.sha256 release-assets/SHAeR-Companion-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: pi_runtime/outputs/shaer_companion/release-assets/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: SHAeR ${{ steps.release.outputs.tag }}
          make_latest: true
          files: release-assets/*
