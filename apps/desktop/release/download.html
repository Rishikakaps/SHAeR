<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download SHAeR Desktop Companion</title>
    <style>
      :root {
        color: #191817;
        background: #f5f2ec;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(760px, 100%);
        border: 1px solid #ded2bd;
        border-radius: 8px;
        background: #fffaf1;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 44px);
      }
      p {
        color: #5f574d;
        line-height: 1.5;
      }
      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 6px;
        background: #191817;
        color: #fffaf1;
        text-decoration: none;
        font-weight: 800;
      }
      .qr {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 20px;
        align-items: center;
        margin-top: 24px;
      }
      .qr img {
        width: 220px;
        height: 220px;
        border: 10px solid white;
        background: white;
      }
      code {
        overflow-wrap: anywhere;
      }
      .missing {
        border: 1px solid #c44;
        background: #fff0f0;
        padding: 12px;
        border-radius: 6px;
      }
      @media (max-width: 640px) {
        .qr { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SHAeR Desktop Companion</h1>
      <p>Download the Windows installer for SHAeR. This page is meant to be opened from a QR code on a phone or another computer.</p>
      <p id="missing" class="missing" hidden>Add the installer URL as <code>?url=https://...</code> when publishing this page.</p>
      <p><a id="download" class="download" href="#">Download for Windows</a></p>
      <section class="qr">
        <img id="qr" alt="QR code for the Windows installer download" />
        <div>
          <p>Scan this QR code to open the same download link.</p>
          <p><code id="url"></code></p>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const installerUrl = params.get("url") || "";
      const download = document.getElementById("download");
      const qr = document.getElementById("qr");
      const url = document.getElementById("url");
      const missing = document.getElementById("missing");
      if (!installerUrl) {
        missing.hidden = false;
        download.removeAttribute("href");
        download.textContent = "Installer URL not configured";
        qr.hidden = true;
      } else {
        download.href = installerUrl;
        url.textContent = installerUrl;
        qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=440x440&data=" + encodeURIComponent(installerUrl);
      }
    </script>
  </body>
</html>
