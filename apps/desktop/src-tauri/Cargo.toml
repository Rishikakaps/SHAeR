[package]
name = "shaer-desktop"
version = "0.1.0"
description = "SHAeR Desktop Companion"
edition = "2021"

[lib]
name = "shaer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
